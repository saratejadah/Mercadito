<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Mi mercado</title>

  <!-- Letra "Nunito" (redondita) (si no hay internet, usa la letra del sistema) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       COLORES Y MEDIDAS
       Todo en tonos pastel. Cambia estos valores para cambiar el look.
       Los colores de cada categoría están en CATEGORIAS (en el script).
       ========================================================= */
    :root {
      --menta: #c9f0dc;           /* color principal (botones) */
      --menta-presionado: #b2e7cb;
      --menta-texto: #237a52;     /* texto sobre menta y cantidades */
      --rosa: #ffe4ea;            /* borrar / limpiar */
      --rosa-texto: #c9506e;
      --lavanda: #f3f0ff;         /* fondos suaves (campos, pastillas) */
      --lavanda-borde: #e6e0fb;
      --fondo: #ffffff;           /* fondo de la página */
      --texto: #3b3a4a;           /* texto principal */
      --texto-suave: #9a98aa;     /* texto secundario */
      --ancho: 520px;             /* ancho de TODOS los bloques */
      --redondo: 24px;            /* esquinas de tarjetas */
      --redondo-chico: 18px;      /* esquinas de campos y botones */
      --toque: 52px;              /* alto mínimo de botones (fácil de tocar) */
      --sombra: 0 6px 20px rgba(120, 110, 170, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.45;
      color: var(--texto);
      background: var(--fondo);
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; color: inherit; cursor: pointer; }

    /* Marco común: el encabezado y el contenido tienen exactamente el mismo ancho */
    .marco {
      width: 100%;
      max-width: calc(var(--ancho) + 32px);
      margin: 0 auto;
      padding-left: 16px;
      padding-right: 16px;
    }
    main.marco { padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }

    /* Todos los bloques ocupan el ancho completo del marco */
    .bloque { display: block; width: 100%; }
    .pila { display: grid; gap: 10px; }   /* elementos apilados, mismo ancho */

    /* ---------- Encabezado: título + pestañas ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: calc(14px + env(safe-area-inset-top, 0px)) 0 12px;
    }
    /* Título solo, sin caja */
    .titulo {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
    }
    /* Pestañas estilo "interruptor" */
    .pestanas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 5px;
      background: var(--lavanda);
      border-radius: var(--redondo);
    }
    .pestana {
      min-height: 46px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: var(--texto-suave);
      font-weight: 700;
    }
    .pestana.activa {
      background: #fff;
      color: var(--texto);
      box-shadow: 0 3px 10px rgba(120, 110, 170, .15);
    }

    /* ---------- Tarjetas (formularios y recetas) ---------- */
    .tarjeta {
      background: #fff;
      border: 2px solid var(--lavanda-borde);
      border-radius: var(--redondo);
      padding: 16px;
      margin: 8px 0 20px;
    }

    /* ---------- Campos de texto ---------- */
    input, textarea {
      width: 100%;
      min-height: var(--toque);
      padding: 12px 18px;
      font: inherit;
      color: var(--texto);
      background: var(--lavanda);
      border: 2px solid transparent;
      border-radius: var(--redondo-chico);
    }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: #bfb3f5; background: #fff; }
    input::placeholder, textarea::placeholder { color: #b7b4c7; }

    .campo label, .etiqueta {
      display: block;
      margin: 0 0 6px 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--texto-suave);
    }

    /* ---------- Pastillas de categoría: cuadrícula de 2, todas iguales ---------- */
    .chips {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 6px 12px;
      border: 2px solid transparent;
      border-radius: var(--redondo-chico);
      background: var(--color, var(--lavanda));
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      line-height: 1.2;
    }
    .chip-emoji { font-size: 20px; }
    .chip.activa { border-color: var(--texto); box-shadow: 0 3px 10px rgba(0,0,0,.08); }

    /* ---------- Botones grandes (todos del mismo ancho) ---------- */
    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: var(--toque);
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;            /* totalmente redondeado */
      background: var(--menta);
      color: var(--menta-texto);
      font-weight: 800;
      transition: transform .1s;
    }
    .boton:active { background: var(--menta-presionado); transform: scale(.98); }
    .boton.rosa { background: var(--rosa); color: var(--rosa-texto); }
    .boton.rosa:active { background: #ffd3de; }
    /* Fila de filtros + botón "Limpiar" a la derecha */
    .fila-filtros { display: flex; align-items: flex-start; gap: 8px; }
    .fila-filtros .filtros { flex: 1; min-width: 0; }
    /* "Limpiar comprados": pastilla pequeña, sin relleno, solo con borde rosa */
    .limpiar {
      flex: none;
      min-height: 44px;
      margin: 4px 0 8px auto;
      padding: 6px 14px;
      border: 2px solid var(--rosa-texto);
      border-radius: 999px;
      background: transparent;
      color: var(--rosa-texto);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .limpiar:active { background: var(--rosa); }

    /* Botón ✕ para borrar, en la esquina de cada cuadro */
    .tile-borrar {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--rosa);
      color: var(--rosa-texto);
      font-size: 9px;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
    }
    .tile-borrar:active { background: var(--rosa-texto); color: #fff; }
    /* Zona de toque invisible más grande que el botón, para que sea fácil de tocar */
    .tile-borrar::before { content: ""; position: absolute; inset: -6px; }

    /* ---------- Filtros por categoría (fila que se desliza de lado) ---------- */
    .filtros {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 8px;
      scrollbar-width: none;
    }
    .filtros::-webkit-scrollbar { display: none; }
    .filtro {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 6px 8px 6px 14px;
      border: 2px solid transparent;
      border-radius: 999px;
      background: var(--lavanda);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      color: #6f6c85;
    }
    .filtro.activa {
      background: var(--color);
      border-color: var(--texto);
      color: var(--texto);
    }
    .cuenta {
      min-width: 26px;
      padding: 1px 8px;
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
      text-align: center;
    }

    /* ---------- Arrastrar y soltar productos ---------- */
    /* Que mantener presionado no seleccione texto ni abra menús */
    .tile.movible { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* Categorías vacías: escondidas, aparecen como zona para soltar solo mientras se arrastra */
    .grupo-vacio { display: none; }
    .arrastrando .grupo-vacio { display: block; }
    .arrastrando .grilla.zona {
      min-height: 64px;
      border-radius: 18px;
      outline: 2px dashed transparent;
      outline-offset: 6px;
      transition: outline-color .15s, background .15s;
    }
    .arrastrando .grupo-vacio .grilla.zona { outline-color: var(--lavanda-borde); }
    .arrastrando .grilla.zona-activa { outline-color: #bfb3f5; background: var(--lavanda); }
    /* El lugar donde va a quedar el producto */
    .tile.origen { opacity: .3; }
    .tile.origen .tile-img { box-shadow: none; }
    /* Copia flotante que sigue el dedo */
    .fantasma {
      position: fixed;
      z-index: 100;
      margin: 0;
      list-style: none;
      pointer-events: none;
      transform: scale(1.12) rotate(4deg);
      filter: drop-shadow(0 10px 14px rgba(80, 70, 130, .25));
    }
    .fantasma .tile-borrar { display: none; }

    /* ---------- Títulos de categoría ---------- */
    .grupo-titulo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 24px 0 14px;
      font-size: 15px;
      font-weight: 800;
      color: var(--texto-suave);
    }

    /* ---------- Cuadrícula de productos ---------- */
    .grilla {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(6, 1fr);   /* 6 por fila: cuadros pequeños */
      gap: 14px 8px;
    }

    .tile { position: relative; }
    .tile-toque {
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      text-align: center;
    }
    /* Cuadro pastel con el dibujo del producto */
    .tile-img {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 16px;
      background: var(--color, #eee);
      font-size: clamp(22px, 6.5vw, 32px);
      box-shadow: var(--sombra);
      transition: transform .15s, opacity .2s, filter .2s;
    }
    .tile-toque:active .tile-img { transform: scale(.93) rotate(-2deg); }
    .tile-nombre {
      display: block;
      margin-top: 5px;
      font-weight: 700;
      font-size: 11px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .tile-cant {
      display: inline-block;
      margin-top: 3px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--menta);
      color: var(--menta-texto);
      font-size: 10px;
      font-weight: 700;
    }


    /* Producto comprado: pálido, tachado y con ✓ */
    .tile.comprado .tile-img { filter: grayscale(.9); opacity: .45; box-shadow: none; }
    .tile.comprado .tile-nombre { text-decoration: line-through; color: var(--texto-suave); }
    .tile.comprado .tile-cant { background: var(--lavanda); color: var(--texto-suave); }
    .tile.comprado .tile-img::after {
      content: "✓";
      position: absolute;
      left: 4px;
      bottom: 4px;
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--menta-texto);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
    }

    /* Mensaje de lista vacía */
    .vacio {
      text-align: center;
      color: var(--texto-suave);
      padding: 36px 16px;
      border: 2px dashed var(--lavanda-borde);
      border-radius: var(--redondo);
      font-weight: 600;
    }
    .vacio-emoji { font-size: 64px; display: block; margin-bottom: 8px; }

    /* ---------- Recetas ---------- */
    .receta {
      border-radius: var(--redondo);
      background: #fff;
      border: 2px solid var(--lavanda-borde);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .receta summary {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      list-style: none;
      cursor: pointer;
    }
    .receta summary::-webkit-details-marker { display: none; }
    .receta-img {
      flex: none;
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      background: var(--color, #fff1c1);
      font-size: 42px;
    }
    .receta-info { flex: 1; min-width: 0; }
    .receta-titulo { margin: 0 0 6px; font-size: 18px; font-weight: 800; line-height: 1.25; }
    .datos { display: flex; flex-wrap: wrap; gap: 6px; }
    .dato {
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--lavanda);
      font-size: 13px;
      font-weight: 600;
      color: #6f6c85;
    }
    .flecha {
      flex: none;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--lavanda);
      color: var(--texto-suave);
      font-size: 20px;
      font-weight: 800;
      transition: transform .2s;
    }
    .receta[open] .flecha { transform: rotate(90deg); }

    .receta-cuerpo { padding: 0 16px 16px; }
    .subtitulo { margin: 8px 0 10px 4px; font-size: 14px; font-weight: 800; color: var(--texto-suave); }

    /* Ingredientes como pastillas con dibujo */
    .ingredientes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .ingrediente {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px 5px 5px;
      border-radius: 999px;
      background: var(--lavanda);
      font-size: 14px;
      font-weight: 600;
    }
    .ingrediente span {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--color, #eee);
      font-size: 16px;
    }

    /* Pasos numerados (solo el número, sin círculo) */
    .pasos { list-style: none; margin: 0 0 16px; padding: 0; counter-reset: paso; }
    .pasos li {
      position: relative;
      padding: 0 0 12px 28px;
      counter-increment: paso;
    }
    .pasos li::before {
      content: counter(paso) ".";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--menta-texto);
      font-weight: 800;
    }

    /* Separación entre los dos botones de cada receta */
    .receta-botones { display: grid; gap: 12px; margin-top: 8px; }

    /* Botones de cada receta: sin relleno, solo con borde */
    .receta-botones .boton {
      background: transparent;
      border: 2px solid var(--menta-texto);
    }
    .receta-botones .boton.rosa { border-color: var(--rosa-texto); }
    .receta-botones .boton.lila { border-color: #8f7fd9; color: #6a58c4; }
    .receta-botones .boton:active { background: var(--menta); }
    .receta-botones .boton.rosa:active { background: var(--rosa); }
    .receta-botones .boton.lila:active { background: var(--lavanda); }
    /* Botón "Cancelar" al editar una receta */
    .boton.suave-gris { background: var(--lavanda); color: var(--texto-suave); }
    .boton.suave-gris:active { background: var(--lavanda-borde); }

    /* Formulario de receta nueva (se abre y cierra) */
    /* Solo el botón, sin caja alrededor */
    .nueva { padding: 0; border: 0; background: none; }
    .nueva summary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: var(--toque);
      border-radius: 999px;
      background: var(--menta);
      color: var(--menta-texto);
      list-style: none;
      font-weight: 800;
      cursor: pointer;
    }
    .nueva summary::-webkit-details-marker { display: none; }

    /* Tarjeta que se abre y cierra con una flecha arriba a la derecha ("Agregar productos") */
    .plegable { padding: 0; }
    .plegable summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: var(--toque);
      padding: 8px 8px 8px 18px;
      list-style: none;
      font-weight: 800;
      cursor: pointer;
    }
    .plegable summary::-webkit-details-marker { display: none; }
    .plegable form { padding: 0 16px 16px; }
    .chevron {
      flex: none;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--lavanda);
      color: var(--texto-suave);
      transition: transform .2s;
    }
    .plegable[open] .chevron { transform: rotate(180deg); }
    .nueva form { padding-top: 16px; }

    /* Selector de dibujo para la receta: 5 por fila, todos iguales */
    .emojis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .emojis label { margin: 0; }
    .emojis input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .emojis span {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 2px solid transparent;
      border-radius: var(--redondo-chico);
      background: var(--lavanda);
      font-size: 26px;
      cursor: pointer;
    }
    .emojis input:checked + span { border-color: var(--texto); background: #fff1c1; }

    /* ---------- Aviso flotante ---------- */
    .aviso {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(20px);
      width: min(calc(100% - 32px), var(--ancho));
      padding: 14px 20px;
      border-radius: var(--redondo);
      background: #fff;
      border: 2px solid var(--menta);
      color: var(--menta-texto);
      font-weight: 700;
      text-align: center;
      box-shadow: 0 10px 30px rgba(120, 110, 170, .2);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .aviso.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <!-- ===================== ENCABEZADO Y PESTAÑAS ===================== -->
  <header>
    <div class="marco">
      <div class="titulo">Mi mercado</div>
      <nav class="pestanas">
        <button class="pestana activa" data-seccion="mercado">🛒 Mercado</button>
        <button class="pestana" data-seccion="recetas">📖 Recetas</button>
      </nav>
    </div>
  </header>

  <main class="marco">

    <!-- ===================== SECCIÓN 1: LISTA DE MERCADO ===================== -->
    <section id="mercado">
      <!-- Caja para agregar productos: se abre y cierra tocando el botón -->
      <details id="caja-agregar" class="tarjeta plegable">
        <summary>
          <span>Agregar productos</span>
          <!-- Flecha (chevron) que gira al abrir/cerrar -->
          <span class="chevron" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </summary>
        <!-- Todo apilado para que cada campo tenga el mismo ancho -->
        <form id="form-item" class="pila" autocomplete="off">
          <input id="item-nombre" required placeholder="¿Qué hace falta? 🥑" aria-label="Producto">
          <!-- Pastillas de categoría (se llenan desde CATEGORIAS) -->
          <div id="chips-categoria" class="chips" role="radiogroup" aria-label="Categoría"></div>
          <button class="boton" type="submit">＋ Agregar a la lista</button>
        </form>
      </details>

      <!-- Fila superior: filtros por categoría (se llenan en dibujarFiltros) + botón "Limpiar" -->
      <div class="fila-filtros">
        <div id="filtros" class="filtros" role="radiogroup" aria-label="Filtrar por categoría"></div>
        <button id="limpiar-comprados" class="limpiar" type="button" aria-label="Limpiar comprados">🧹 Limpiar</button>
      </div>

      <!-- Aquí se dibuja la lista (ver función dibujarLista) -->
      <div id="lista-mercado"></div>
    </section>

    <!-- ===================== SECCIÓN 2: RECETAS ===================== -->
    <section id="recetas" hidden>
      <!-- El mismo formulario sirve para crear una receta nueva o editar una existente -->
      <details id="caja-receta" class="tarjeta nueva">
        <summary id="titulo-form-receta">＋ Agregar receta nueva</summary>
        <form id="form-receta" autocomplete="off">
          <div class="campo">
            <label for="receta-nombre">Nombre</label>
            <input id="receta-nombre" required placeholder="Ej. Arroz con pollo">
          </div>
          <div class="campo">
            <label>Dibujo</label>
            <!-- Opciones de dibujo (se llenan desde EMOJIS_RECETA) -->
            <div id="emojis-receta" class="emojis"></div>
          </div>
          <div class="campo">
            <label for="receta-tiempo">Tiempo</label>
            <input id="receta-tiempo" placeholder="Ej. 30 min">
          </div>
          <div class="campo">
            <label for="receta-ingredientes">Ingredientes (uno por línea)</label>
            <textarea id="receta-ingredientes" required placeholder="Arroz&#10;Pollo&#10;Cebolla"></textarea>
          </div>
          <div class="campo">
            <label for="receta-pasos">Pasos (uno por línea)</label>
            <textarea id="receta-pasos" placeholder="Lava el arroz&#10;Sofríe la cebolla"></textarea>
          </div>
          <div class="pila">
            <button id="guardar-receta" class="boton" type="submit">Guardar receta</button>
            <!-- Solo se ve mientras se edita una receta -->
            <button id="cancelar-edicion" class="boton suave-gris" type="button" hidden>Cancelar</button>
          </div>
        </form>
      </details>

      <!-- Aquí se dibujan las recetas (ver función dibujarRecetas) -->
      <div id="lista-recetas"></div>
    </section>
  </main>

    function cargar(clave, porDefecto) {
      try {
        const texto = localStorage.getItem(clave);
        return texto ? JSON.parse(texto) : porDefecto;
      } catch (e) {
        return porDefecto; // si algo falla, empezamos con el valor por defecto
      }
    }

    function guardarLocal(clave, valor) {
      try {
        localStorage.setItem(clave, JSON.stringify(valor));
      } catch (e) {
        // sin almacenamiento local: la nube sigue funcionando
      }
    }

    // Guarda en este navegador y en la nube
    function guardar(clave, valor) {
      guardarLocal(clave, valor);
      guardarEnNube(clave, valor);
    }

    // --- Nube ---
    // En Firebase se guardan dos documentos: mercado/lista y mercado/recetas
    const DOCUMENTOS = { [CLAVE_LISTA]: "lista", [CLAVE_RECETAS]: "recetas" };
    let nube = null; // se llena cuando la conexión con Firebase está lista

    function guardarEnNube(clave, valor) {
      if (!nube) return;
      nube.setDoc(nube.doc(nube.db, "mercado", DOCUMENTOS[clave]), { items: valor })
        .catch(() => mostrarAviso("No se pudo guardar en la nube"));
    }

    // Se conecta a Firebase y escucha cambios: cuando alguien agrega o marca algo
    // en otro dispositivo, la página se actualiza sola.
    async function conectarNube() {
      if (!FIREBASE_CONFIG.projectId) return; // sin configurar: solo este navegador
      try {
        const V = "10.12.2"; // versión de Firebase
        const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
        const { getFirestore, doc, setDoc, onSnapshot } =
          await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
        const db = getFirestore(initializeApp(FIREBASE_CONFIG));
        nube = { db, doc, setDoc };

        const escuchar = (clave, alCambiar) => {
          onSnapshot(doc(db, "mercado", DOCUMENTOS[clave]), foto => {
            if (foto.exists()) {
              const items = foto.data().items || [];
              guardarLocal(clave, items);
              alCambiar(items);
            } else {
              // La nube todavía está vacía: subir lo que hay en este navegador
              guardarEnNube(clave, clave === CLAVE_LISTA ? lista : recetas);
            }
          }, () => mostrarAviso("No se pudo conectar con la nube"));
        };
        escuchar(CLAVE_LISTA, items => { lista = items; dibujarLista(); });
        escuchar(CLAVE_RECETAS, items => { recetas = items; dibujarRecetas(); });
      } catch (e) {
        mostrarAviso("Sin conexión: los cambios se guardan solo en este dispositivo");
      }
    }

    // Evita que el texto escrito por el usuario se interprete como HTML
    function escapar(texto) {
      return String(texto ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // Convierte un texto con varias líneas en una lista, sin líneas vacías
    function lineas(texto) {
      return texto.split("\n").map(l => l.trim()).filter(Boolean);
    }

    // ¿El nombre contiene esta palabra completa? Acepta plural ("tomate" encuentra "tomates")
    function contienePalabra(nombre, palabra) {
      return new RegExp("(^|\\s)" + sinTildes(palabra) + "(s|es)?(\\s|$)").test(sinTildes(nombre));
    }

    // Minúsculas y sin tildes, para comparar ("Limón" → "limon")
    function sinTildes(texto) {
      return texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    }

    // Busca la información de una categoría por su nombre
    function infoCategoria(nombre) {
      return CATEGORIAS.find(c => c.nombre === nombre) || CATEGORIAS[CATEGORIAS.length - 1];
    }

    function adivinarCategoria(nombre) {
      for (const categoria in PALABRAS_CATEGORIA) {
        if (PALABRAS_CATEGORIA[categoria].some(p => contienePalabra(nombre, p))) return categoria;
      }
      return "Otros";
    }

    // Revisa las palabras más largas primero ("crema dental" antes que "crema").
    const PALABRAS_EMOJI = Object.keys(EMOJIS).sort((a, b) => b.length - a.length);
    function emojiDe(nombre, categoria) {
      const palabra = PALABRAS_EMOJI.find(p => contienePalabra(nombre, p));
      return palabra ? EMOJIS[palabra] : infoCategoria(categoria).emoji;
    }

    }

      dibujarChips();
    });

    // Mientras se escribe el nombre, se sugiere la categoría automáticamente
    document.getElementById("item-nombre").addEventListener("input", e => {
      if (categoriaTocada) return;
      const sugerida = adivinarCategoria(e.target.value);
      if (sugerida !== categoriaElegida) {
        categoriaElegida = sugerida;
        dibujarChips();
      }
    });

    // --- Un producto: cuadro de color con su dibujo ---
    function htmlItem(item) {
      const cat = infoCategoria(item.categoria);
      return `
        <li class="tile ${item.comprado ? "comprado" : "movible"}" data-id="${item.id}">
          <button class="tile-toque" data-accion="marcar" data-id="${item.id}">
            <span class="tile-img" style="--color:${cat.color}">${emojiDe(item.nombre, item.categoria)}</span>
            <span class="tile-nombre">${escapar(item.nombre)}</span>
            ${item.cantidad ? `<span class="tile-cant">${escapar(item.cantidad)}</span>` : ""}
          </button>
          <button class="tile-borrar" data-accion="borrar" data-id="${item.id}" aria-label="Borrar ${escapar(item.nombre)}">✕</button>
        </li>`;
    }

    // --- Filtros por categoría ---
    let filtro = "Todos"; // "Todos" o el nombre de una categoría

    // Dibuja las pastillas de filtro: "Todos" + cada categoría que tenga productos.
    // El número es cuántos faltan por comprar.
    function dibujarFiltros() {
      const contenedor = document.getElementById("filtros");
      const conProductos = CATEGORIAS.filter(c => lista.some(i => infoCategoria(i.categoria) === c));

      // Si la categoría filtrada se quedó sin productos, volver a "Todos"
      if (filtro !== "Todos" && !conProductos.some(c => c.nombre === filtro)) filtro = "Todos";

      // Solo tiene sentido filtrar si hay más de una categoría
      contenedor.hidden = conProductos.length < 2;

      const pendientesDe = cat => lista.filter(i => !i.comprado && (!cat || infoCategoria(i.categoria) === cat)).length;
      const opciones = [
        { nombre: "Todos", emoji: "✨", color: "#dcecff", cuenta: pendientesDe(null) },
        ...conProductos.map(c => ({ ...c, cuenta: pendientesDe(c) }))
      ];
      contenedor.innerHTML = opciones.map(o => `
        <button type="button" class="filtro ${o.nombre === filtro ? "activa" : ""}" style="--color:${o.color}"
                role="radio" aria-checked="${o.nombre === filtro}" data-filtro="${escapar(o.nombre)}">
          ${o.emoji} ${escapar(o.nombre)} <span class="cuenta">${o.cuenta}</span>
        </button>`).join("");
    }

    document.getElementById("filtros").addEventListener("click", e => {
      const boton = e.target.closest(".filtro");
      if (!boton) return;
      filtro = boton.dataset.filtro;
      dibujarLista();
    });

    // Dibuja toda la lista: pendientes agrupados por categoría y comprados al final
    function dibujarLista() {
      // Si llega un cambio de otro dispositivo mientras se arrastra, se dibuja al soltar
      if (arrastre?.activo) { arrastre.redibujar = true; return; }
      dibujarFiltros();
      const contenedor = document.getElementById("lista-mercado");
      // Con un filtro activo, solo se muestran productos de esa categoría
      const visibles = lista.filter(i => filtro === "Todos" || infoCategoria(i.categoria).nombre === filtro);
      const pendientes = visibles.filter(i => !i.comprado);
      const comprados = lista.filter(i => i.comprado);
      const compradosVisibles = visibles.filter(i => i.comprado);

      if (lista.length === 0) {
        contenedor.innerHTML = `
          <p class="vacio"><span class="vacio-emoji">🧺</span>
          Tu lista está vacía.<br>Agrega productos arriba o desde una receta.</p>`;
      } else {
        let html = "";
        for (const cat of CATEGORIAS) {
          // Productos con una categoría que ya no existe se muestran en "Otros"
          const items = pendientes.filter(i => infoCategoria(i.categoria) === cat);
          // Las categorías vacías se dibujan escondidas: aparecen solo al arrastrar,
          // para poder soltar un producto ahí
          if (items.length || filtro === "Todos") {
            html += `<div class="grupo ${items.length ? "" : "grupo-vacio"}">
                       <h3 class="grupo-titulo">${cat.emoji} ${escapar(cat.nombre)}</h3>
                       <ul class="grilla zona" data-categoria="${escapar(cat.nombre)}">${items.map(htmlItem).join("")}</ul>
                     </div>`;
          }
        }
        if (compradosVisibles.length) {
          html += `<h3 class="grupo-titulo">✅ Comprados (${compradosVisibles.length})</h3>
                   <ul class="grilla">${compradosVisibles.map(htmlItem).join("")}</ul>`;
        }
        contenedor.innerHTML = html;
      }

      document.getElementById("limpiar-comprados").hidden = comprados.length === 0;
    }

    // Agregar un producto a la lista.
    // Si ya existe y estaba comprado, solo se vuelve a marcar como pendiente (no se repite).
    // Devuelve false si ya estaba pendiente.
    function agregarProducto(nombre, cantidad, categoria) {
      const existente = lista.find(i => i.nombre.toLowerCase() === nombre.toLowerCase());
      if (existente) {
        if (!existente.comprado) return false;
        existente.comprado = false;
        if (cantidad) existente.cantidad = cantidad;
        return true;
      }
      lista.push({ id: nuevoId(), nombre, cantidad, categoria, comprado: false });
      return true;
    }

    // Formulario: agregar producto
    document.getElementById("form-item").addEventListener("submit", e => {
      e.preventDefault();
      const campoNombre = document.getElementById("item-nombre");
      const nombre = campoNombre.value.trim();
      if (!nombre) return;

      if (agregarProducto(nombre, "", categoriaElegida)) {
        guardar(CLAVE_LISTA, lista);
        dibujarLista();
      } else {
        mostrarAviso(`"${nombre}" ya está en la lista`);
      }
      // Limpiar campos y dejar todo listo para el siguiente producto
      campoNombre.value = "";
      categoriaElegida = "Otros";
      categoriaTocada = false;
      dibujarChips();
      campoNombre.focus();
    });

    // Tocar un producto lo marca como comprado (o lo desmarca); tocar su ✕ lo borra
    document.getElementById("lista-mercado").addEventListener("click", e => {
      if (ignorarClick) return; // el "click" que llega justo después de soltar un arrastre
      const boton = e.target.closest("[data-accion]");
      if (!boton) return;
      const item = lista.find(i => i.id === boton.dataset.id);
      if (!item) return;

      if (boton.dataset.accion === "borrar") {
        lista = lista.filter(i => i !== item);
        mostrarAviso(`Se borró "${item.nombre}"`);
      } else {
        item.comprado = !item.comprado;
      }
      guardar(CLAVE_LISTA, lista);
      dibujarLista();
    });

    /* ---------------------------------------------------------
       ARRASTRAR Y SOLTAR productos (para cambiar el orden o la categoría)
       - En el celular: mantener presionado un momento y luego arrastrar.
         Así un toque normal sigue marcando el producto y deslizar sigue haciendo scroll.
       - Con mouse: hacer clic y arrastrar.
       Mientras se arrastra, el cuadro original se mueve por la lista mostrando dónde
       va a quedar, y una copia flotante sigue el dedo.
       --------------------------------------------------------- */
    const ESPERA_TOQUE = 350;  // milisegundos que hay que mantener presionado en el celular
    let arrastre = null;       // datos del arrastre en curso
    let ignorarClick = false;

    const listaMercado = document.getElementById("lista-mercado");

    function prepararArrastre(tile, x, y, esToque) {
      arrastre = { tile, x0: x, y0: y, x, y, activo: false };
      if (esToque) arrastre.temporizador = setTimeout(activarArrastre, ESPERA_TOQUE);
    }

    function cancelarArrastre() {
      if (arrastre) clearTimeout(arrastre.temporizador);
      arrastre = null;
    }

    function activarArrastre() {
      const { tile } = arrastre;
      const r = tile.getBoundingClientRect();
      arrastre.activo = true;
      arrastre.dx = arrastre.x - r.left;
      arrastre.dy = arrastre.y - r.top;
      arrastre.categoriaInicial = tile.closest(".zona").dataset.categoria;

      // Copia flotante que sigue el dedo / mouse
      const fantasma = tile.cloneNode(true);
      fantasma.classList.add("fantasma");
      fantasma.style.width = r.width + "px";
      document.body.appendChild(fantasma);
      arrastre.fantasma = fantasma;

      tile.classList.add("origen");
      listaMercado.classList.add("arrastrando");
      if (navigator.vibrate) navigator.vibrate(25); // pequeña vibración en Android
      moverArrastre(arrastre.x, arrastre.y);
      desplazarSolo();
    }

    function moverArrastre(x, y) {
      arrastre.x = x;
      arrastre.y = y;
      const { tile, fantasma } = arrastre;
      fantasma.style.left = (x - arrastre.dx) + "px";
      fantasma.style.top = (y - arrastre.dy) + "px";

      // ¿Sobre qué categoría y qué producto está el dedo?
      const debajo = document.elementFromPoint(x, y);
      const zona = debajo?.closest(".zona");
      if (!zona) return;
      listaMercado.querySelectorAll(".zona-activa").forEach(z => z !== zona && z.classList.remove("zona-activa"));
      zona.classList.add("zona-activa");

      const sobre = debajo.closest(".tile.movible");
      if (sobre && sobre !== tile) {
        // Antes o después de ese producto, según en qué mitad esté el dedo
        const r = sobre.getBoundingClientRect();
        zona.insertBefore(tile, x < r.left + r.width / 2 ? sobre : sobre.nextSibling);
      } else if (!sobre && tile.parentNode !== zona) {
        zona.appendChild(tile); // espacio vacío de otra categoría: al final
      }
    }

    // Si el dedo se acerca al borde de arriba o de abajo, la página se desplaza sola
    function desplazarSolo() {
      if (!arrastre?.activo) return;
      const arriba = document.querySelector("header").getBoundingClientRect().bottom + 50;
      const abajo = window.innerHeight - 70;
      const y = arrastre.y;
      const velocidad = y < arriba ? -(arriba - y) / 4 : y > abajo ? (y - abajo) / 4 : 0;
      if (velocidad) {
        window.scrollBy(0, Math.max(-20, Math.min(20, velocidad)));
        moverArrastre(arrastre.x, arrastre.y);
      }
      requestAnimationFrame(desplazarSolo);
    }

    function soltarArrastre() {
      const { tile, fantasma, categoriaInicial } = arrastre;
      const zona = tile.parentNode;
      const categoria = zona.dataset.categoria;
      const siguienteId = tile.nextElementSibling?.dataset.id;

      fantasma.remove();
      listaMercado.classList.remove("arrastrando");
      arrastre = null;
      ignorarClick = true;
      setTimeout(() => { ignorarClick = false; }, 300);

      // Mover el producto dentro de la lista guardada
      const item = lista.find(i => i.id === tile.dataset.id);
      if (item) {
        lista = lista.filter(i => i !== item);
        item.categoria = categoria;
        const posSiguiente = lista.findIndex(i => i.id === siguienteId);
        if (posSiguiente >= 0) {
          lista.splice(posSiguiente, 0, item);
        } else {
          // Al final de su categoría (después del último producto de esa categoría)
          const ultimo = lista.map(i => infoCategoria(i.categoria).nombre).lastIndexOf(categoria);
          lista.splice(ultimo + 1, 0, item);
        }
        guardar(CLAVE_LISTA, lista);
        if (categoria !== categoriaInicial) mostrarAviso(`"${item.nombre}" ahora está en ${categoria}`);
      }
      dibujarLista(); // también muestra cambios que llegaron de otro dispositivo durante el arrastre
    }

    // --- Celular (toque) ---
    listaMercado.addEventListener("touchstart", e => {
      const tile = e.target.closest(".tile.movible");
      if (!tile || e.target.closest(".tile-borrar") || e.touches.length > 1) return;
      prepararArrastre(tile, e.touches[0].clientX, e.touches[0].clientY, true);
    }, { passive: true });

    document.addEventListener("touchmove", e => {
      if (!arrastre) return;
      const t = e.touches[0];
      if (!arrastre.activo) {
        // Si el dedo se movió antes de tiempo, es un scroll normal: cancelar
        if (Math.hypot(t.clientX - arrastre.x0, t.clientY - arrastre.y0) > 10) cancelarArrastre();
        return;
      }
      e.preventDefault(); // no hacer scroll mientras se arrastra
      moverArrastre(t.clientX, t.clientY);
    }, { passive: false });

    const finToque = () => { if (arrastre?.activo) soltarArrastre(); else cancelarArrastre(); };
    document.addEventListener("touchend", finToque);
    document.addEventListener("touchcancel", finToque);

    // Evitar el menú que aparece al mantener presionado
    listaMercado.addEventListener("contextmenu", e => { if (e.target.closest(".tile.movible")) e.preventDefault(); });

    // --- Computador (mouse) ---
    listaMercado.addEventListener("mousedown", e => {
      const tile = e.target.closest(".tile.movible");
      if (e.button !== 0 || !tile || e.target.closest(".tile-borrar")) return;
      prepararArrastre(tile, e.clientX, e.clientY, false);
    });

    document.addEventListener("mousemove", e => {
      if (!arrastre) return;
      if (!arrastre.activo) {
        // Empieza a arrastrar cuando el mouse se mueve un poquito con el botón presionado
        if (Math.hypot(e.clientX - arrastre.x0, e.clientY - arrastre.y0) < 6) return;
        arrastre.x = e.clientX;
        arrastre.y = e.clientY;
        activarArrastre();
      }
      moverArrastre(e.clientX, e.clientY);
    });

    document.addEventListener("mouseup", () => { if (arrastre?.activo) soltarArrastre(); else cancelarArrastre(); });

    // Botón "Limpiar comprados": no borra nada, solo desmarca los comprados
    // para que vuelvan a la lista de pendientes
    document.getElementById("limpiar-comprados").addEventListener("click", () => {
      const comprados = lista.filter(i => i.comprado);
      comprados.forEach(i => { i.comprado = false; });
      guardar(CLAVE_LISTA, lista);
      dibujarLista();
      const n = comprados.length;
      mostrarAviso(`${n} producto${n === 1 ? "" : "s"} de nuevo por comprar`);
    });

    /* =========================================================
       RECETAS
       ========================================================= */

    // Dibujo de una receta (las guardadas antes de esta versión no tenían uno)
    function emojiReceta(r) {
      return r.emoji || RECETAS_EJEMPLO.find(e => e.nombre === r.nombre)?.emoji || "🍲";
    }

    // Color pastel del cuadro de cada receta (se van turnando)
    const COLORES_RECETA = ["#fff1c4", "#ffe0e6", "#d9f5e1", "#dcecff", "#ebe4ff"];
    function colorReceta(posicion) {
      return COLORES_RECETA[posicion % COLORES_RECETA.length];
    }

    function dibujarRecetas() {
      const contenedor = document.getElementById("lista-recetas");
      // Recordar qué recetas estaban abiertas, para que no se cierren
      // cuando llega un cambio desde otro dispositivo
      const abiertas = new Set([...contenedor.querySelectorAll("details[open]")].map(d => d.dataset.id));
      if (recetas.length === 0) {
        contenedor.innerHTML = `
          <p class="vacio"><span class="vacio-emoji">📖</span>
          No hay recetas todavía.<br>Agrega una con el botón de arriba.</p>`;
        return;
      }
      contenedor.innerHTML = recetas.map((r, n) => {
        const datos = [
          r.tiempo ? `<span class="dato">⏱ ${escapar(r.tiempo)}</span>` : "",
          r.porciones ? `<span class="dato">🍽 ${escapar(r.porciones)} porcion${r.porciones == 1 ? "" : "es"}</span>` : "",
          `<span class="dato">🧺 ${r.ingredientes.length} ingredientes</span>`
        ].join("");

        const ingredientes = r.ingredientes.map(i => {
          const cat = adivinarCategoria(i);
          return `<span class="ingrediente"><span style="--color:${infoCategoria(cat).color}">${emojiDe(i, cat)}</span>${escapar(i)}</span>`;
        }).join("");

        return `
          <details class="receta" data-id="${r.id}" ${abiertas.has(r.id) ? "open" : ""}>
            <summary>
              <span class="receta-img" style="--color:${colorReceta(n)}">${emojiReceta(r)}</span>
              <span class="receta-info">
                <p class="receta-titulo">${escapar(r.nombre)}</p>
                <span class="datos">${datos}</span>
              </span>
              <span class="flecha">›</span>
            </summary>
            <div class="receta-cuerpo">
              <p class="subtitulo">Ingredientes</p>
              <div class="ingredientes">${ingredientes}</div>
              ${r.pasos.length ? `<p class="subtitulo">Pasos</p>
                <ol class="pasos">${r.pasos.map(p => `<li>${escapar(p)}</li>`).join("")}</ol>` : ""}
              <div class="receta-botones">
                <button class="boton" data-accion="agregar" data-id="${r.id}">🛒 Agregar ingredientes a la lista</button>
                <button class="boton lila" data-accion="editar" data-id="${r.id}">✏️ Editar receta</button>
                <button class="boton rosa" data-accion="borrar" data-id="${r.id}">Borrar receta</button>
              </div>
            </div>
          </details>`;
      }).join("");
    }

    // Botones dentro de cada receta
    document.getElementById("lista-recetas").addEventListener("click", e => {
      const boton = e.target.closest("[data-accion]");
      if (!boton) return;
      const receta = recetas.find(r => r.id === boton.dataset.id);
      if (!receta) return;

      if (boton.dataset.accion === "agregar") {
        let agregados = 0;
        receta.ingredientes.forEach(ing => {
          if (agregarProducto(ing, "", adivinarCategoria(ing))) agregados++;
        });
        guardar(CLAVE_LISTA, lista);
        dibujarLista();
        mostrarAviso(agregados
          ? `Se agregaron ${agregados} ingrediente${agregados === 1 ? "" : "s"} a la lista`
          : "Todos los ingredientes ya estaban en la lista");
      }

      if (boton.dataset.accion === "editar") empezarEdicion(receta);

      if (boton.dataset.accion === "borrar") {
        if (!confirm(`¿Borrar la receta "${receta.nombre}"?`)) return;
        recetas = recetas.filter(r => r !== receta);
        guardar(CLAVE_RECETAS, recetas);
        dibujarRecetas();
        if (editandoId === receta.id) terminarEdicion();
      }
    });

    /* --- Editar una receta: se usa el mismo formulario de "Agregar receta nueva" --- */
    const formReceta = document.getElementById("form-receta");
    const cajaReceta = document.getElementById("caja-receta");
    let editandoId = null; // id de la receta que se está editando (null = receta nueva)

    // Llena el formulario con los datos de la receta y lo abre arriba de la página
    function empezarEdicion(receta) {
      editandoId = receta.id;
      document.getElementById("receta-nombre").value = receta.nombre;
      document.getElementById("receta-tiempo").value = receta.tiempo || "";
      document.getElementById("receta-ingredientes").value = receta.ingredientes.join("\n");
      document.getElementById("receta-pasos").value = receta.pasos.join("\n");
      formReceta.querySelectorAll("input[name=emoji]").forEach(op => { op.checked = op.value === emojiReceta(receta); });

      document.getElementById("titulo-form-receta").textContent = `✏️ Editando "${receta.nombre}"`;
      document.getElementById("guardar-receta").textContent = "Guardar cambios";
      document.getElementById("cancelar-edicion").hidden = false;
      cajaReceta.open = true;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Deja el formulario vacío y cerrado, listo para una receta nueva
    function terminarEdicion() {
      editandoId = null;
      formReceta.reset();
      document.getElementById("titulo-form-receta").textContent = "＋ Agregar receta nueva";
      document.getElementById("guardar-receta").textContent = "Guardar receta";
      document.getElementById("cancelar-edicion").hidden = true;
      cajaReceta.open = false;
    }

    document.getElementById("cancelar-edicion").addEventListener("click", terminarEdicion);
    // Cerrar el formulario mientras se edita también cancela la edición
    cajaReceta.addEventListener("toggle", () => { if (!cajaReceta.open && editandoId) terminarEdicion(); });

    // Opciones de dibujo en el formulario de receta
    document.getElementById("emojis-receta").innerHTML = EMOJIS_RECETA.map((em, i) => `
      <label><input type="radio" name="emoji" value="${em}" ${i === 0 ? "checked" : ""}><span>${em}</span></label>`
    ).join("");

    // Formulario: guardar receta nueva, o los cambios de la receta que se está editando
    formReceta.addEventListener("submit", e => {
      e.preventDefault();
      const existente = editandoId && recetas.find(r => r.id === editandoId);
      const datos = {
        nombre: document.getElementById("receta-nombre").value.trim(),
        // Si no se eligió ninguno, se conserva el dibujo que ya tenía la receta
        emoji: formReceta.querySelector("input[name=emoji]:checked")?.value || existente?.emoji || "🍲",
        tiempo: document.getElementById("receta-tiempo").value.trim(),
        ingredientes: lineas(document.getElementById("receta-ingredientes").value),
        pasos: lineas(document.getElementById("receta-pasos").value)
      };
      if (!datos.nombre || datos.ingredientes.length === 0) return;

      if (existente) {
        Object.assign(existente, datos); // se queda en el mismo lugar de la lista
        mostrarAviso("Cambios guardados");
      } else {
        recetas.unshift({ id: editandoId || nuevoId(), ...datos }); // la nueva aparece de primera
        mostrarAviso("Receta guardada");
      }
      guardar(CLAVE_RECETAS, recetas);
      dibujarRecetas();
      terminarEdicion();
    });

    /* =========================================================
       INICIO
       ========================================================= */
    // Caja de agregar productos: recordar en este dispositivo si se dejó abierta o cerrada
    const cajaAgregar = document.getElementById("caja-agregar");
    cajaAgregar.open = cargar("mercado.cajaAbierta", true);
    cajaAgregar.addEventListener("toggle", () => guardarLocal("mercado.cajaAbierta", cajaAgregar.open));
    // Al abrirla tocando el botón, dejar el cursor listo para escribir
    cajaAgregar.querySelector("summary").addEventListener("click", () => {
      setTimeout(() => { if (cajaAgregar.open) document.getElementById("item-nombre").focus(); });
    });

    dibujarChips();
    dibujarLista();
    dibujarRecetas();
    conectarNube();
  </script>
</body>
</html>
